<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chumash Check-In Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Lora:ital,wght@0,400;0,600;1,400&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Lora', serif; background-color: #fff9f0; color: #3e362e;
    display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
  }
  .intake-container {
    background: #fff; padding: 50px; border: 1px solid #e3dcd2; border-radius: 4px;
    box-shadow: 0 10px 30px rgba(62,54,46,0.05); max-width: 550px; width: 100%; text-align: center;
  }
  h1 { font-family: 'Playfair Display', serif; font-size: 2.4rem; margin-bottom: 30px; font-weight: 800; }
  .btn-primary, .intake-choice, .btn-record {
    display: block; width: 100%; padding: 16px; margin: 12px 0; border: 1px solid #d3c7b7;
    background-color: #fff; cursor: pointer; font-family: 'Lora', serif; font-size: 1.05rem; transition: all 0.3s ease;
  }
  .btn-primary { background-color: #3e362e; color: #fff9f0; border: none; text-transform: uppercase; font-weight: 600; }
  .btn-primary:hover { background-color: #5a4e42; }
  .intake-choice:hover { background-color: #fcf6eb; border-color: #3e362e; }
  .btn-record { background-color: #900; color: white; border: none; font-weight: 600; }
  .btn-record.recording { background-color: #f00; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
  .intake-hebrew-word { font-family: 'Frank Ruhl Libre', serif; font-size: 4rem; margin: 30px 0; color: #2c2520; }
  .student-input { width: calc(100% - 32px); padding: 15px; font-family: 'Lora', serif; font-size: 1.1rem; border: 1px solid #d3c7b7; margin-bottom: 25px; background: #fdfbf8; }
  .intake-progress { height: 4px; background: #eee; margin: 20px 0; }
  .intake-progress-bar { height: 100%; width: 0%; background: #3e362e; transition: width 0.4s; }
  .intake-skip { background: none; border: none; color: #a6998a; cursor: pointer; font-size: 0.9rem; margin-top: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="intake-container">
    <h1>Chumash Check-In Hub</h1>
    <div id="nameArea"><input type="text" id="studentName" class="student-input" placeholder="Enter Full Name"><button class="btn-primary" id="nameSubmitBtn">Begin</button></div>
    <div id="hubMenuArea" class="hidden">
        <p>Welcome, <span id="displayName"></span>. What are we doing today?</p>
        <button class="intake-choice" onclick="startVocab()">Vocabulary Check-In</button>
        <button class="intake-choice" onclick="startAudio()">Reading Fluency Submission</button>
    </div>
    <div id="selfEvalArea" class="hidden">
        <p>Choose your vocab comfort level:</p>
        <button class="intake-choice" onclick="setVocabLevel('Just Starting', 1)">Just Starting</button>
        <button class="intake-choice" onclick="setVocabLevel('Beginner', 1)">Beginner</button>
        <button class="intake-choice" onclick="setVocabLevel('Intermediate', 2)">Intermediate</button>
        <button class="intake-choice" onclick="setVocabLevel('Advanced', 3)">Advanced</button>
        <button class="intake-skip" onclick="goToHub()">&larr; Back</button>
    </div>
    <div id="quizProgress" class="hidden"><div class="intake-progress-bar" id="progressBar"></div></div>
    <div id="quizArea" class="hidden"></div>
    <div id="audioArea" class="hidden">
        <p>Read the assigned Chumash passage clearly into your microphone.</p>
        <p style="font-size: 0.85rem; color: #a6998a;">Recordings auto-stop at 90 seconds — that's enough for a fluency passage and keeps uploads reliable.</p>
        <button id="recordBtn" class="btn-record" onclick="toggleRecording()">🎤 Start Recording</button>
        <p id="audioStatus" style="font-size: 0.9rem; color: #666; margin-top: 15px;"></p>
        <button id="audioBackBtn" class="intake-skip" onclick="goToHub()">&larr; Back</button>
    </div>
    <div id="resultsArea" class="hidden"><h2 id="resultsTitle">Task Complete</h2><p id="resultsDesc"></p>
        <button class="intake-choice" onclick="goToHub()">Back to Menu</button>
    </div>
</div>

<script>
// --- YOUR APPS SCRIPT URL ---
// Paste the URL you got in Step 2 here!
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOsTcNWamk4Sk2DM6175X7uHjWM3ICSesbcUWJYWmxogqnbNJpKHp3oStb-1ch-VGu/exec";

const state = { name: "", selfEval: null, history: [], currentRank: 1, questionCount: 0 };
let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let recordingTimer = null;
let activeStream = null; // the live mic stream, so Back can release it properly
let isUploading = false; // guards against closing the tab mid-upload

// Warn before the student can close/refresh the tab while recording OR
// while a save is in flight — once the tab is gone, the recording is lost
// and any in-progress request is aborted, so this is the only real
// protection against losing a submission. Browsers show their own generic
// wording here regardless of what's set below.
window.addEventListener('beforeunload', (e) => {
    if (isUploading || isRecording) {
        e.preventDefault();
        e.returnValue = '';
    }
});

// Returns to the main menu from any screen. If a recording is in progress,
// stops it and releases the microphone WITHOUT submitting it.
function goToHub() {
    if (isRecording) {
        isRecording = false;
        clearInterval(recordingTimer);
        if (mediaRecorder) {
            mediaRecorder.onstop = null; // detach so it doesn't try to upload
            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }
    }
    if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
    }
    hide('selfEvalArea'); hide('quizArea'); hide('quizProgress');
    hide('audioArea'); hide('resultsArea');

    // Reset per-attempt state so a fresh vocab run or recording starts clean.
    state.selfEval = null; state.history = []; state.currentRank = 1; state.questionCount = 0;
    const recordBtn = document.getElementById('recordBtn');
    recordBtn.disabled = false;
    recordBtn.innerText = "🎤 Start Recording";
    recordBtn.classList.remove("recording");
    document.getElementById('audioStatus').innerText = "";
    document.getElementById('audioBackBtn').style.display = '';

    show('hubMenuArea');
}

// Gemini's inline-audio request cap is 20MB (prompt + base64 audio combined).
// Auto-stopping recordings keeps every submission comfortably under that limit
// instead of silently failing on longer readings.
const MAX_RECORDING_SECONDS = 90;
// Safety check on the raw blob before upload; base64 inflates size ~33%,
// so keep raw audio well under the 20MB post-encoding ceiling.
const MAX_BLOB_BYTES = 12 * 1024 * 1024; // ~12MB raw

document.getElementById('nameSubmitBtn').addEventListener('click', () => {
    state.name = document.getElementById('studentName').value.trim();
    if (!state.name) return alert("Please enter your name.");
    document.getElementById('displayName').innerText = state.name;
    hide('nameArea'); show('hubMenuArea');
});

function hide(id) { document.getElementById(id).classList.add('hidden'); }
function show(id) { document.getElementById(id).classList.remove('hidden'); }

// (Paste your FULL 41-word QUESTION_BANK array right here)
const TOTAL_QUESTIONS = 10;
const QUESTION_BANK = [
  { ri: 1, rank: 1, display: "אֶרֶץ", meaning: "land", options: ["land", "sky", "water", "light"] },
  { ri: 11, rank: 2, display: "אֲשֶׁר", meaning: "that / which", options: ["that / which", "when", "there", "because"] },
  { ri: 25, rank: 3, display: "פֶּן", meaning: "lest / so that not", options: ["lest / so that not", "maybe", "also", "here"] }
];

function startVocab() { hide('hubMenuArea'); show('selfEvalArea'); }
function setVocabLevel(evalName, rank) {
    state.selfEval = evalName; state.currentRank = rank;
    hide('selfEvalArea'); show('quizArea'); show('quizProgress'); runNext();
}

function runNext() {
    state.questionCount++;
    if (state.questionCount > TOTAL_QUESTIONS) return finishVocab();
    document.getElementById('progressBar').style.width = ((state.questionCount-1)/TOTAL_QUESTIONS*100)+'%';
    let potential = QUESTION_BANK.filter(q => q.rank === state.currentRank && !state.history.find(h => h.ri === q.ri));
    if (potential.length === 0) potential = QUESTION_BANK.filter(q => !state.history.find(h => h.ri === q.ri));
    const q = potential[Math.floor(Math.random()*potential.length)];
    const choices = [...q.options].sort(() => Math.random() - 0.5);
    document.getElementById('quizArea').innerHTML = `
      <div class="intake-hebrew-word">${q.display}</div>
      <div class="intake-choices">${choices.map(o => `<button class="intake-choice" onclick="window.ans('${o}', '${q.meaning}', ${q.ri}, '${q.display}', ${q.rank})">${o}</button>`).join('')}</div>
      <button class="intake-skip" onclick="window.ans(null, '${q.meaning}', ${q.ri}, '${q.display}', ${q.rank})">I'm not sure &rarr;</button>`;
}

window.ans = (picked, correct, ri, word, rank) => {
    state.history.push({ ri, word, correct: (picked === correct), picked: picked ? picked : "Skipped" });
    if((picked === correct) && state.currentRank < 3) state.currentRank++;
    else if(!(picked === correct) && state.currentRank > 1) state.currentRank--;
    runNext();
};

function finishVocab() {
    hide('quizArea'); hide('quizProgress');
    document.getElementById('resultsDesc').innerHTML = `Checking answers...`; show('resultsArea');
    const score = state.history.filter(h => h.correct).length;

    // FETCH TO EXTERNAL APPS SCRIPT URL
    isUploading = true;
    fetch(GAS_WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "saveVocab",
            payload: { name: state.name, selfEval: state.selfEval, finalRank: state.currentRank, score: score, total: TOTAL_QUESTIONS, history: state.history }
        }),
        headers: { "Content-Type": "text/plain;charset=utf-8" }
    })
    .then(res => res.json())
    .then(data => {
        isUploading = false;
        if (data.success) {
            document.getElementById('resultsDesc').innerHTML = `Vocab Check-In logged successfully!`;
        } else {
            document.getElementById('resultsDesc').innerHTML = `Error saving data: ${data.error || 'Unknown error'}`;
        }
    })
    .catch(err => { isUploading = false; document.getElementById('resultsDesc').innerHTML = `Error saving data: ${err}`; });
}

function startAudio() { hide('hubMenuArea'); show('audioArea'); }

async function toggleRecording() {
    const btn = document.getElementById('recordBtn');
    const status = document.getElementById('audioStatus');

    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            activeStream = stream;
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = sendAudioToServer;
            mediaRecorder.start();
            isRecording = true;
            btn.innerText = "⏹ Stop & Submit";
            btn.classList.add("recording");

            // Auto-stop at MAX_RECORDING_SECONDS so uploads stay under Gemini's
            // inline-audio request limit. Shows a live countdown too.
            let secondsLeft = MAX_RECORDING_SECONDS;
            status.innerText = `Recording... Read clearly. Auto-stops in ${secondsLeft}s.`;
            recordingTimer = setInterval(() => {
                secondsLeft--;
                if (secondsLeft <= 0) {
                    clearInterval(recordingTimer);
                    if (isRecording) toggleRecording();
                } else {
                    status.innerText = `Recording... Read clearly. Auto-stops in ${secondsLeft}s.`;
                }
            }, 1000);
        } catch (err) {
            alert("Microphone access denied. Please check your browser settings.");
        }
    } else {
        clearInterval(recordingTimer);
        mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "Uploading...";
        btn.classList.remove("recording");
        btn.disabled = true;
        document.getElementById('audioBackBtn').style.display = 'none'; // don't allow leaving mid-upload
        status.innerText = "Analyzing reading with AI... this takes about 10-15 seconds. Please do not exit the app or close this window.";
    }
}

function sendAudioToServer() {
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

    // Guard against oversized recordings before spending time on upload.
    if (audioBlob.size > MAX_BLOB_BYTES) {
        document.getElementById('audioStatus').innerText =
            "That recording is too long to process reliably. Please re-record a shorter passage (under 90 seconds).";
        document.getElementById('recordBtn').disabled = false;
        document.getElementById('recordBtn').innerText = "🎤 Start Recording";
        document.getElementById('audioBackBtn').style.display = '';
        return;
    }

    const reader = new FileReader();
    reader.readAsDataURL(audioBlob);
    reader.onloadend = function() {
        const base64Audio = reader.result.split(',')[1];

        // FETCH TO EXTERNAL APPS SCRIPT URL
        isUploading = true;
        fetch(GAS_WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "processAudio",
                payload: { base64Audio: base64Audio, studentName: state.name }
            }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(data => {
            isUploading = false;
            if (data.success) {
                hide('audioArea');
                document.getElementById('resultsDesc').innerHTML = `Audio processed! Your teacher has the results.`;
                show('resultsArea');
            } else {
                // Previously this branch never ran, so failures looked identical
                // to successes. Now the real server-side error is shown.
                document.getElementById('audioStatus').innerText = `Error: ${data.error || 'Unknown error'}. Please try recording again.`;
                document.getElementById('recordBtn').disabled = false;
                document.getElementById('recordBtn').innerText = "🎤 Start Recording";
                document.getElementById('audioBackBtn').style.display = '';
            }
        })
        .catch(err => {
            isUploading = false;
            document.getElementById('audioStatus').innerText = "An error occurred while uploading: " + err;
            document.getElementById('recordBtn').disabled = false;
            document.getElementById('recordBtn').innerText = "🎤 Start Recording";
            document.getElementById('audioBackBtn').style.display = '';
        });
    }
}
</script>
</body>
</html>
