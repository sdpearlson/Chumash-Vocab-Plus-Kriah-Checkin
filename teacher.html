<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chumash Check-In Hub — Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Lora', serif; background-color: #fff9f0; color: #3e362e;
    margin: 0; padding: 30px 20px 60px;
  }
  h1 {
    font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; margin: 0 0 6px; color: #2c2520;
    text-align: center;
  }
  .subtitle { text-align: center; color: #a6998a; margin: 0 0 30px; font-size: 0.95rem; }
  .container { max-width: 1150px; margin: 0 auto; }
  .card {
    background: #fff; border: 1px solid #e3dcd2; border-radius: 6px;
    box-shadow: 0 6px 20px rgba(62,54,46,0.05); padding: 30px;
  }
  .login-card { max-width: 420px; margin: 60px auto; text-align: center; }
  .text-input {
    width: 100%; padding: 13px; font-family: 'Lora', serif; font-size: 1.05rem;
    border: 1px solid #d3c7b7; margin-bottom: 16px; background: #fdfbf8; border-radius: 3px;
  }
  select.text-input { cursor: pointer; }
  .btn-primary {
    background-color: #3e362e; color: #fff9f0; border: none; padding: 13px 26px;
    text-transform: uppercase; font-weight: 600; letter-spacing: 0.03em; font-family: 'Lora', serif;
    font-size: 0.95rem; cursor: pointer; border-radius: 3px; transition: background 0.2s ease;
  }
  .btn-primary:hover { background-color: #5a4e42; }
  .btn-secondary {
    background: none; border: 1px solid #d3c7b7; color: #3e362e; padding: 9px 18px;
    font-family: 'Lora', serif; font-size: 0.85rem; cursor: pointer; border-radius: 3px;
  }
  .btn-secondary:hover { border-color: #3e362e; }
  .error-msg { color: #a33; font-size: 0.9rem; margin-top: -6px; margin-bottom: 14px; min-height: 1.2em; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab-btn {
    background: #fff; border: 1px solid #d3c7b7; color: #3e362e; padding: 10px 20px;
    font-family: 'Lora', serif; font-size: 0.95rem; cursor: pointer; border-radius: 3px 3px 0 0;
    border-bottom: none; position: relative; top: 1px;
  }
  .tab-btn.active { background: #3e362e; color: #fff9f0; border-color: #3e362e; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .hidden { display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #ece5d8; vertical-align: top; }
  th { font-weight: 600; color: #2c2520; background: #fbf6ec; white-space: nowrap; }
  tr:hover td { background: #fdfbf5; }
  .cell-pct { font-weight: 600; border-radius: 3px; padding: 4px 8px; display: inline-block; min-width: 46px; text-align: center; }
  .pct-good { background: #e8f0e3; color: #3c6b2e; }
  .pct-mid { background: #fff3d6; color: #8a6d1f; }
  .pct-low { background: #f5dcdc; color: #a33; }
  .pct-none { color: #c2b8a8; }
  .trend-badge { font-size: 0.78rem; font-weight: 600; margin-left: 6px; padding: 2px 7px; border-radius: 3px; display: inline-block; }
  .trend-up { color: #3c6b2e; background: #e8f0e3; }
  .trend-down { color: #a33; background: #f5dcdc; }
  .trend-steady { color: #8a7c68; background: #f1ebe0; }
  .muted { color: #a6998a; font-size: 0.85rem; }
  .section-heading {
    font-family: 'Frank Ruhl Libre', serif; font-size: 1.2rem; margin: 30px 0 12px; color: #2c2520;
  }
  .section-heading:first-child { margin-top: 0; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  .bar-label { width: 260px; flex-shrink: 0; font-size: 0.9rem; }
  .bar-track { flex-grow: 1; background: #f1ebe0; border-radius: 3px; height: 18px; overflow: hidden; }
  .bar-fill { height: 100%; background: #3e362e; border-radius: 3px; }
  .bar-fill.good { background: #6ea15a; }
  .bar-fill.mid { background: #d9a63b; }
  .bar-fill.low { background: #c0605f; }
  .bar-value { width: 60px; flex-shrink: 0; font-size: 0.88rem; text-align: right; font-weight: 600; }
  .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ece5d8; font-size: 0.9rem; }
  .empty-state { color: #a6998a; text-align: center; padding: 40px 0; font-style: italic; }
  .history-controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  .history-controls select { max-width: 280px; }
  .attempt-detail { font-size: 0.85rem; color: #6b6055; white-space: pre-line; }
  .loading { text-align: center; padding: 60px 0; color: #a6998a; }
  .scope-heading { font-family: 'Frank Ruhl Libre', serif; font-size: 1.5rem; margin: 0 0 2px; color: #2c2520; }
  .scope-subtitle { color: #a6998a; font-size: 0.9rem; margin: 0 0 20px; }
  .trends-block { background: #fbf6ec; border: 1px solid #ece5d8; border-radius: 6px; padding: 18px 20px; margin-bottom: 26px; }
  .trends-block .section-heading { margin-top: 0; }
  .trends-text { margin: 6px 0 0; line-height: 1.55; }
  td .muted { font-size: 0.8rem; line-height: 1.4; }
  .nested-toggle {
    display: inline-flex; align-items: center; gap: 8px; background: none; border: none;
    padding: 0; margin: 0; font: inherit; font-weight: inherit; color: inherit; cursor: pointer;
  }
  .nested-toggle:hover { color: #5a4e42; }
  .nested-arrow { color: #a6998a; font-size: 0.75rem; width: 10px; display: inline-block; }
  .nested-breakdown { margin: 6px 0 4px; padding-left: 6px; }
  .student-row { border-bottom: 1px solid #ece5d8; }
  .student-row:last-child { border-bottom: none; }
  .student-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: none; padding: 12px 4px; font-family: 'Lora', serif;
    font-size: 1rem; font-weight: 600; color: #2c2520; cursor: pointer;
  }
  .student-toggle:hover { background: #fdfbf5; }
  .student-arrow { color: #a6998a; font-size: 0.75rem; width: 12px; display: inline-block; }
  .student-detail { padding: 0 0 12px; }
  .detail-row { display: flex; align-items: baseline; gap: 14px; padding: 7px 0 7px 28px; border-top: 1px dashed #f1ebe0; flex-wrap: wrap; }
  .detail-row:first-child { border-top: none; }
  .detail-label { width: 150px; flex-shrink: 0; font-weight: 600; font-size: 0.85rem; color: #6b6055; }
  .detail-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.85rem; flex: 1; min-width: 0; }
  .detail-chip { color: #6b6055; }
  a.detail-chip.audio-link { color: #2f6fa3; text-decoration: underline; cursor: pointer; }
  .audio-retry-btn {
    background: none; border: 1px solid #d3c7b7; color: #3e362e; padding: 3px 10px;
    font-family: 'Lora', serif; font-size: 0.82rem; cursor: pointer; border-radius: 3px; margin-left: 4px;
  }
  .audio-retry-btn:hover { border-color: #3e362e; }
  .audio-retry-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .detail-chip.muted { color: #a6998a; }
  .comparison-wrap { overflow-x: auto; margin-bottom: 26px; border: 1px solid #ece5d8; border-radius: 6px; }
  .comparison-table { width: auto; min-width: 100%; }
  .comparison-table th, .comparison-table td { white-space: nowrap; }
  .comparison-table th:first-child, .comparison-table td:first-child {
    position: sticky; left: 0; background: #fbf6ec; z-index: 1; white-space: nowrap;
  }
  .comparison-table td:first-child { background: #fff; font-weight: 600; }
  .comparison-table .cell-empty { color: #c2b8a8; }
  .comparison-table .cell-pct + .cell-pct { margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <h1>Chumash Check-In Hub</h1>
  <p class="subtitle">Teacher Dashboard</p>

  <div id="loginArea" class="card login-card">
    <p>Enter the teacher passcode to view results.</p>
    <input type="password" id="passwordInput" class="text-input" placeholder="Passcode">
    <p class="error-msg" id="loginError"></p>
    <button class="btn-primary" id="loginBtn">View Dashboard</button>
  </div>

  <div id="dashboardArea" class="card" style="display:none;">
    <div class="top-bar">
      <div class="tabs">
        <button class="tab-btn active" data-tab="averages">Class Averages</button>
        <button class="tab-btn" data-tab="history">Student History</button>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <select id="classFilterSelect" class="text-input" style="margin-bottom:0; width:auto; display:none;">
          <option value="">All Students</option>
        </select>
        <button class="btn-secondary" id="refreshBtn">&#8635; Refresh</button>
      </div>
    </div>

    <div id="loadingArea" class="loading">Loading results...</div>

    <div id="historyPanel" class="tab-panel">
      <div class="history-controls">
        <select id="historyStudentSelect" class="text-input"></select>
        <button class="btn-secondary" id="historyExportBtn">📥 Export CSV</button>
      </div>
      <div id="historyMatrixArea"></div>
      <div style="overflow-x:auto;">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Section</th>
              <th>Result</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="historyTbody"></tbody>
        </table>
      </div>
    </div>

    <div id="averagesPanel" class="tab-panel active"></div>
  </div>
</div>

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxOsTcNWamk4Sk2DM6175X7uHjWM3ICSesbcUWJYWmxogqnbNJpKHp3oStb-1ch-VGu/exec";

let dashboardData = null; // { vocab: [], vocabMastery: [], knowledge: [], skills: [], navi: [], audio: [] }

// Bumped every time dashboardData is replaced (login or Refresh) so cached
// AI trend summaries — which are keyed off this — get regenerated instead
// of showing stale text after new submissions come in.
let dashboardDataVersion = 0;
// Cache of already-generated trend summaries, keyed by filter value + data
// version, so switching tabs or re-rendering doesn't re-call Gemini for a
// scope we already have a summary for.
const trendsSummaryCache = {};
// Incremented on every renderAverages() call; used to make sure a slow
// Gemini response can't overwrite the page after the teacher has already
// switched to a different filter.
let trendsRenderToken = 0;
// The exact rows currently shown in the History tab's table — kept in sync
// by renderHistory() so the "Export CSV" button always exports precisely
// what's on screen (same filters applied) without recomputing it separately.
let currentHistoryRows = [];

const KNOWLEDGE_SUBSECTIONS = ['Bereishit', 'Shemot', 'Vayikra', 'Bamidbar', 'Devarim'];
const SKILLS_SUBSECTIONS = ['Decoding the Text', 'Understanding the Text', 'Rashi Skills', 'Additional Skills (Gematria, Genuvah Patach, Aliyot)'];
const NAVI_SUBSECTIONS = ['Yehoshua', 'Shoftim', 'Shmuel I', 'Shmuel II', 'Megillat Esther', 'Megillat Rut', 'Sefer Yonah'];
// Rubric v2 (out of 10, 5 dimensions) — see AUDIO_ANALYSIS_HEADERS in
// Code.gs.txt for why Accuracy/Decoding/Pronunciation were merged into one
// "Accuracy & Decoding" score and Fluency & Pace/Phrasing & Expression were
// merged into "Fluency & Phrasing". Rows from before this change live in a
// separate "Audio Analysis (Old Rubric, out of 4)" sheet and don't feed
// this dashboard, since a 1-4 score isn't comparable to a 1-10 one.
const AUDIO_DIMENSIONS = ['Accuracy & Decoding', 'Nekudot', 'Fluency & Phrasing', 'Self-Correction', 'Overall'];
const OVERALL_LABELS = {
    10: 'Exceeds Expectations', 9: 'Exceeds Expectations',
    8: 'Meets Expectations', 7: 'Meets Expectations',
    6: 'Developing', 5: 'Developing', 4: 'Developing',
    3: 'Beginning', 2: 'Beginning', 1: 'Beginning'
};
const VOCAB_MASTERY_GOAL = 300; // matches Code.gs.txt — total words/shorashim a student works toward

// --- Parsing helpers -------------------------------------------------

// Parses the "X / Y" fraction format used across every results sheet
// (Vocab's Score, Knowledge/Skills/Navi's Total Score and per-category
// cells) into { correct, total, pct }. Returns null if unparseable.
function parseFraction(str) {
    if (typeof str !== 'string') return null;
    const m = str.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);
    if (!m) return null;
    const correct = parseFloat(m[1]), total = parseFloat(m[2]);
    if (!total) return { correct, total, pct: null };
    return { correct, total, pct: (correct / total) * 100 };
}

// Handles two shapes: the plain "78%" string this app writes, AND a raw
// number. The latter shows up because Google Sheets sometimes silently
// auto-converts a written "78%" string into a percentage-formatted NUMBER
// cell — so getValues() hands back 0.78 (or occasionally 78, if the sheet
// wasn't percent-formatted) instead of the text "78%". This is why
// Chumash Skills specifically could show no percentage: it's the only
// section whose overall score comes from a "%"-suffixed column instead of
// an "X / Y" fraction column, so it's the only one exposed to this quirk.
function parsePercent(val) {
    if (typeof val === 'number' && !isNaN(val)) {
        return val <= 1 ? val * 100 : val;
    }
    if (typeof val !== 'string') return null;
    const m = val.match(/(-?\d+(?:\.\d+)?)\s*%/);
    return m ? parseFloat(m[1]) : null;
}

function pctClass(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return 'pct-none';
    if (pct >= 85) return 'pct-good';
    if (pct >= 70) return 'pct-mid';
    return 'pct-low';
}

function barClass(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return '';
    if (pct >= 85) return 'good';
    if (pct >= 70) return 'mid';
    return 'low';
}

function fmtPct(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return '—';
    return Math.round(pct) + '%';
}

function toDate(v) {
    const d = v instanceof Date ? v : new Date(v);
    return isNaN(d.getTime()) ? null : d;
}

function fmtDate(v) {
    const d = toDate(v);
    if (!d) return '—';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
        ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function average(nums) {
    const clean = nums.filter(n => typeof n === 'number' && !isNaN(n));
    if (!clean.length) return null;
    return clean.reduce((a, b) => a + b, 0) / clean.length;
}

// Returns, for a given sheet's rows, a Map of student name -> their most
// recent row (by Timestamp). Rows already come back roughly chronological
// (sheets are appended to), but sorting explicitly is safer.
function latestByStudent(rows) {
    const map = new Map();
    rows.forEach(row => {
        const name = (row['Student Name'] || '').toString().trim();
        if (!name) return;
        const existing = map.get(name);
        const t = toDate(row['Timestamp']);
        if (!existing || (t && toDate(existing['Timestamp']) && t > toDate(existing['Timestamp']))) {
            map.set(name, row);
        }
    });
    return map;
}

// Same idea as latestByStudent, but keeps every row (sorted oldest-to-
// newest) instead of collapsing to just the latest — needed to compare an
// attempt against the one before it for the trend indicator below.
function sortedRowsByStudent(rows) {
    const map = new Map();
    (rows || []).forEach(row => {
        const name = (row['Student Name'] || '').toString().trim();
        if (!name) return;
        if (!map.has(name)) map.set(name, []);
        map.get(name).push(row);
    });
    map.forEach(list => list.sort((a, b) => {
        const da = toDate(a['Timestamp']), db = toDate(b['Timestamp']);
        if (!da || !db) return 0;
        return da - db;
    }));
    return map;
}

// The latest attempt and the one immediately before it, from one student's
// sorted row list (see sortedRowsByStudent). `previous` is null when there's
// only one attempt (or none) — callers use that to skip the trend badge
// rather than compare against nothing.
function latestAndPrevious(sortedList) {
    if (!sortedList || !sortedList.length) return { latest: null, previous: null };
    return {
        latest: sortedList[sortedList.length - 1],
        previous: sortedList.length > 1 ? sortedList[sortedList.length - 2] : null
    };
}

// The actual "trend/decline indicator" the dashboard was missing — a small
// ▲/▼/■ badge comparing the latest attempt to the one before it, so a
// student who's been sliding doesn't look identical to one who's held
// steady just because both show the same latest score. `isCount` is for
// raw-number comparisons (Reading Fluency's 1-10 Overall score, Vocab
// Mastery's word count) rather than percentage points, so the badge reads
// "+2" instead of "+2pts". Returns null (render nothing) when there's no
// previous attempt to compare against.
function buildTrendBadge(latestVal, previousVal, isCount) {
    if (latestVal === null || latestVal === undefined || isNaN(latestVal)) return null;
    if (previousVal === null || previousVal === undefined || isNaN(previousVal)) return null;
    const delta = latestVal - previousVal;
    const threshold = isCount ? 0.5 : 3; // ignore noise smaller than this
    const rounded = Math.round(Math.abs(delta));
    const unit = isCount ? '' : (' pt' + (rounded === 1 ? '' : 's'));

    const span = document.createElement('span');
    span.title = 'Compared to the previous attempt';
    if (Math.abs(delta) < threshold) {
        span.className = 'trend-badge trend-steady';
        span.textContent = '■ steady';
    } else if (delta > 0) {
        span.className = 'trend-badge trend-up';
        span.textContent = '▲ +' + rounded + unit;
    } else {
        span.className = 'trend-badge trend-down';
        span.textContent = '▼ −' + rounded + unit;
    }
    return span;
}

// Union of the roster sheet with every student name that appears in any
// results sheet — so a student who's missing from the roster (or whose
// typed name doesn't quite match it) still shows up rather than silently
// disappearing.
function allStudentNames() {
    const names = new Set();
    (dashboardData.roster || []).forEach(name => {
        const trimmed = (name || '').toString().trim();
        if (trimmed) names.add(trimmed);
    });
    ['vocab', 'vocabMastery', 'knowledge', 'skills', 'navi', 'audio'].forEach(key => {
        (dashboardData[key] || []).forEach(row => {
            const name = (row['Student Name'] || '').toString().trim();
            if (name) names.add(name);
        });
    });
    return [...names].sort((a, b) => a.localeCompare(b));
}

// Turns a grade label ("6", "K", "(No Grade Listed)") into display text
// ("6th Grade", "K Grade", "Ungraded").
function ordinalSuffix(n) {
    const rem100 = n % 100;
    if (rem100 >= 11 && rem100 <= 13) return 'th';
    switch (n % 10) {
        case 1: return 'st';
        case 2: return 'nd';
        case 3: return 'rd';
        default: return 'th';
    }
}

function gradeDisplayLabel(grade) {
    if (grade === '(No Grade Listed)') return 'Ungraded';
    const trimmed = String(grade).trim();
    const n = parseInt(trimmed, 10);
    if (isNaN(n) || String(n) !== trimmed) return trimmed + ' Grade';
    return n + ordinalSuffix(n) + ' Grade';
}

// The current filter, resolved into a scope object every renderer works
// from: { type: 'all'|'grade'|'class', label, students, gradeGroup? }.
// "All Students" (empty filter) covers the full roster+submissions union;
// a grade or class scopes down to that grade's/class's roster. Submissions
// under a name that doesn't match any roster row only show up under "All
// Students," since there's no way to know which grade/class they belong to.
function getFilterScope() {
    const raw = el('classFilterSelect').value;
    const byGrade = dashboardData.rosterByGrade || [];

    if (raw && raw.indexOf('grade:') === 0) {
        const gradeLabel = raw.slice('grade:'.length);
        const gradeGroup = byGrade.find(g => g.grade === gradeLabel);
        const students = gradeGroup
            ? [...new Set(gradeGroup.classes.flatMap(c => c.students))].sort((a, b) => a.localeCompare(b))
            : [];
        return { type: 'grade', label: gradeDisplayLabel(gradeLabel), students, gradeGroup };
    }

    if (raw && raw.indexOf('class:') === 0) {
        const classId = raw.slice('class:'.length);
        for (const g of byGrade) {
            const c = g.classes.find(cls => cls.classId === classId);
            if (c) {
                return {
                    type: 'class',
                    label: `${c.className} — ${c.teacherName}`,
                    students: [...c.students].sort((a, b) => a.localeCompare(b)),
                    classObj: c
                };
            }
        }
    }

    return { type: 'all', label: 'All Students', students: allStudentNames() };
}

function getFilteredStudentNames() {
    return getFilterScope().students;
}

function filterRowsByStudents(rows, allowedNames) {
    const allowed = new Set(allowedNames);
    return (rows || []).filter(row => allowed.has((row['Student Name'] || '').toString().trim()));
}

// Populates the class filter dropdown from dashboardData.rosterByGrade:
// "All Students", then either a flat list of classes (if there's only one
// grade bucket — including schools with no Grade column at all) or, when
// there's more than one grade, a grade-level option plus an <optgroup> of
// that grade's classes, for each grade. Hidden entirely if the Roster sheet
// doesn't exist yet. Preserves the current selection across re-population
// (e.g. after Refresh).
function populateClassFilter() {
    const select = el('classFilterSelect');
    const current = select.value;
    const byGrade = dashboardData.rosterByGrade || [];

    select.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'All Students';
    select.appendChild(allOpt);

    const appendClassOption = (parent, c) => {
        const opt = document.createElement('option');
        opt.value = 'class:' + c.classId;
        opt.textContent = `${c.className} — ${c.teacherName}`;
        parent.appendChild(opt);
    };

    byGrade.forEach(g => {
        const gradeLabel = gradeDisplayLabel(g.grade);
        if (byGrade.length > 1) {
            const gradeOpt = document.createElement('option');
            gradeOpt.value = 'grade:' + g.grade;
            gradeOpt.textContent = gradeLabel;
            select.appendChild(gradeOpt);

            const group = document.createElement('optgroup');
            group.label = gradeLabel;
            g.classes.forEach(c => appendClassOption(group, c));
            select.appendChild(group);
        } else {
            // Nothing to group by — just list classes flat, like before.
            g.classes.forEach(c => appendClassOption(select, c));
        }
    });

    const hasAnyClasses = byGrade.some(g => g.classes.length);
    select.style.display = hasAnyClasses ? '' : 'none';
    if (current && [...select.options].some(o => o.value === current)) select.value = current;
    // A filter change should re-render everything (History's student list,
    // Averages' numbers and trend summary) without jumping the teacher back
    // to a different tab.
    select.onchange = renderTabContents;
}

// --- Login -------------------------------------------------------------

function el(id) { return document.getElementById(id); }

el('loginBtn').addEventListener('click', attemptLogin);
el('passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

function attemptLogin() {
    const password = el('passwordInput').value;
    if (!password) { el('loginError').textContent = 'Please enter a passcode.'; return; }
    el('loginBtn').disabled = true;
    el('loginBtn').textContent = 'Checking...';
    el('loginError').textContent = '';

    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getDashboard', payload: { password } }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => {
        el('loginBtn').disabled = false;
        el('loginBtn').textContent = 'View Dashboard';
        if (data.success) {
            dashboardData = data.data;
            el('loginArea').style.display = 'none';
            el('dashboardArea').style.display = 'block';
            renderAll();
        } else {
            el('loginError').textContent = data.error || 'Incorrect passcode.';
        }
    })
    .catch(err => {
        el('loginBtn').disabled = false;
        el('loginBtn').textContent = 'View Dashboard';
        el('loginError').textContent = 'Could not reach the server: ' + err;
    });
}

el('refreshBtn').addEventListener('click', () => {
    const password = el('passwordInput').value;
    el('loadingArea').style.display = 'block';
    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getDashboard', payload: { password } }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => {
        el('loadingArea').style.display = 'none';
        if (data.success) {
            dashboardData = data.data;
            dashboardDataVersion++; // invalidate cached trend summaries — the numbers may have changed
            renderTabContents();
        }
    });
});

// --- Tabs ----------------------------------------------------------------

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        el(btn.dataset.tab + 'Panel').classList.add('active');
    });
});

// Called once right after login: shows the dashboard on the default
// (Class Averages, All Students) tab and renders every tab's contents.
function renderAll() {
    el('loadingArea').style.display = 'none';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="averages"]').classList.add('active');
    el('averagesPanel').classList.add('active');
    dashboardDataVersion++;
    renderTabContents();
}

// Re-renders every tab's contents WITHOUT changing which tab is currently
// visible — used by Refresh and whenever the grade/class filter changes, so
// the teacher isn't unexpectedly bounced to a different tab.
function renderTabContents() {
    populateClassFilter();
    renderHistoryControls();
    renderHistory();
    renderAverages();
}

// --- Per-student score rows ----------------------------------------------
// Used only by the individual-student accordion on the Class Averages tab
// (shown once a specific class is selected). Each student's name expands
// to one horizontal line per section — Vocabulary, Chumash Knowledge, etc.
// — showing the overall score plus everything else that sheet row has:
// per-subsection scores and the AI-generated recommendation/summary text,
// not just the top-line number, per the "include all the information from
// the sheet" ask.

function pctSpan(pct, extraText) {
    const span = document.createElement('span');
    span.className = 'cell-pct ' + pctClass(pct);
    span.textContent = fmtPct(pct) + (extraText ? ' ' + extraText : '');
    return span;
}

function detailChip(text, muted) {
    const span = document.createElement('span');
    span.className = 'detail-chip' + (muted ? ' muted' : '');
    span.textContent = text;
    return span;
}

// Builds one section's horizontal detail line: a score badge followed by
// whatever chips apply (sub-scores, group/mistake notes, AI recommendation
// text), all laid out left-to-right and wrapping as needed.
function buildVocabDetailLine(row, previousRow) {
    const line = document.createElement('div');
    line.className = 'detail-line';
    if (!row) { line.appendChild(detailChip('No attempt yet', true)); return line; }
    const frac = parseFraction(row['Score']);
    line.appendChild(pctSpan(frac ? frac.pct : null));
    const prevFrac = previousRow ? parseFraction(previousRow['Score']) : null;
    const badge = buildTrendBadge(frac ? frac.pct : null, prevFrac ? prevFrac.pct : null);
    if (badge) line.appendChild(badge);
    if (row['Assigned Group']) line.appendChild(detailChip('Group ' + row['Assigned Group'], true));
    if (row['Score']) line.appendChild(detailChip(row['Score'], true));
    if (row['Mistakes'] && row['Mistakes'] !== 'None') line.appendChild(detailChip('Missed: ' + row['Mistakes'], true));
    return line;
}

// previousRow is accepted for consistency with the other detail-line
// builders, but the "Vocab Mastery" sheet only ever keeps ONE upserted row
// per student (current state, not an append log — see saveVocabState in
// Code.gs.txt), so there's never actually a previous attempt to compare
// against here and the trend badge won't appear. Showing a trend for this
// one would need the sheet itself to start logging a new row per session
// instead of overwriting in place.
function buildVocabMasteryDetailLine(row, previousRow) {
    const line = document.createElement('div');
    line.className = 'detail-line';
    if (!row) { line.appendChild(detailChip('No attempt yet', true)); return line; }
    const count = Number(row['Total Mastered']) || 0;
    const pct = (count / VOCAB_MASTERY_GOAL) * 100;
    line.appendChild(pctSpan(pct, `(${count} / ${VOCAB_MASTERY_GOAL} words)`));
    const prevCount = previousRow ? Number(previousRow['Total Mastered']) : null;
    const badge = buildTrendBadge(count, prevCount, true);
    if (badge) line.appendChild(badge);
    return line;
}

// Shared by Chumash Knowledge and Navi Knowledge, which have the same
// shape: an overall "Total Score" fraction, per-sefer fraction columns,
// and an "Areas to Focus On" recommendation.
function buildFractionDetailLine(row, previousRow, field, subsections, notesField) {
    const line = document.createElement('div');
    line.className = 'detail-line';
    if (!row) { line.appendChild(detailChip('No attempt yet', true)); return line; }
    const frac = parseFraction(row[field]);
    line.appendChild(pctSpan(frac ? frac.pct : null));
    const prevFrac = previousRow ? parseFraction(previousRow[field]) : null;
    const badge = buildTrendBadge(frac ? frac.pct : null, prevFrac ? prevFrac.pct : null);
    if (badge) line.appendChild(badge);
    if (row[field]) line.appendChild(detailChip('Total: ' + row[field], true));
    (subsections || []).forEach(sub => { if (row[sub]) line.appendChild(detailChip(sub + ': ' + row[sub], true)); });
    if (notesField && row[notesField]) line.appendChild(detailChip(row[notesField], true));
    return line;
}

function buildSkillsDetailLine(row, previousRow) {
    const line = document.createElement('div');
    line.className = 'detail-line';
    if (!row) { line.appendChild(detailChip('No attempt yet', true)); return line; }
    const pct = parsePercent(row['Percentage']);
    line.appendChild(pctSpan(pct));
    const prevPct = previousRow ? parsePercent(previousRow['Percentage']) : null;
    const badge = buildTrendBadge(pct, prevPct);
    if (badge) line.appendChild(badge);
    if (row['Total Score']) line.appendChild(detailChip('Total: ' + row['Total Score'], true));
    SKILLS_SUBSECTIONS.forEach(sub => { if (row[sub]) line.appendChild(detailChip(sub + ': ' + row[sub], true)); });
    if (row['Areas to Focus On']) line.appendChild(detailChip(row['Areas to Focus On'], true));
    return line;
}

// Recordings are archived to Drive independent of grading (see
// processAudioSubmission in Code.gs.txt), so a submission that failed AI
// grading still shows up here — as a "needs manual review" row with a link
// to the original recording — rather than just vanishing.
function buildAudioLink(row) {
    const url = row['Audio File'];
    if (!url || url === '(not saved)') return null;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = '🔊 Listen to recording';
    a.className = 'detail-chip audio-link';
    return a;
}

// A small button next to a "needs manual review" row that re-sends the
// already-archived recording (by Drive file ID, nothing re-uploaded from the
// student) to Gemini for grading. On success it overwrites the placeholder
// row in the sheet with real scores and refreshes the dashboard in place.
function buildAudioRetryButton(row) {
    const btn = document.createElement('button');
    btn.className = 'audio-retry-btn';
    btn.textContent = '🔁 Retry AI Grading';
    btn.addEventListener('click', () => retryAudioGrading(btn, row));
    return btn;
}

function retryAudioGrading(btn, row) {
    const password = el('passwordInput').value;
    btn.disabled = true;
    btn.textContent = 'Regrading...';

    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({
            action: 'retryAudioGrading',
            payload: {
                password: password,
                timestamp: row['Timestamp'],
                studentName: row['Student Name'],
                audioUrl: row['Audio File']
            }
        }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => {
        if (!data.success) {
            btn.disabled = false;
            btn.textContent = '🔁 Retry AI Grading';
            alert(data.error || 'Retry failed. Please try again.');
            return;
        }
        // Re-pull the dashboard so this row now shows its real scores
        // instead of the "needs manual review" placeholder.
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'getDashboard', payload: { password: password } }),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(res => res.json())
        .then(refreshed => {
            if (refreshed.success) {
                dashboardData = refreshed.data;
                dashboardDataVersion++;
                renderTabContents();
            } else {
                btn.disabled = false;
                btn.textContent = '🔁 Retry AI Grading';
            }
        });
    })
    .catch(err => {
        btn.disabled = false;
        btn.textContent = '🔁 Retry AI Grading';
        alert('Could not reach the server: ' + err);
    });
}

// A "needs manual review" row (AI grading failed) has no Overall score, so
// it's never usable as either side of a trend comparison — this treats it
// the same as "no attempt" for that purpose.
function audioOverallOrNull(row) {
    if (!row) return null;
    const needsReview = (row['Reading Summary'] || '').toString().indexOf('AI grading failed') === 0;
    if (needsReview) return null;
    const overall = Number(row['Overall']);
    return isNaN(overall) ? null : overall;
}

function buildAudioDetailLine(row, previousRow) {
    const line = document.createElement('div');
    line.className = 'detail-line';
    if (!row) { line.appendChild(detailChip('No submission yet', true)); return line; }

    const needsReview = (row['Reading Summary'] || '').toString().indexOf('AI grading failed') === 0;
    if (needsReview) {
        const span = document.createElement('span');
        span.className = 'cell-pct pct-none';
        span.textContent = 'Needs manual review';
        line.appendChild(span);
        line.appendChild(detailChip(row['Reading Summary'], true));
        const link = buildAudioLink(row);
        if (link) line.appendChild(link);
        // The recording is archived even when grading failed, so a teacher
        // can re-run AI grading on it later (e.g. once Gemini isn't
        // overloaded anymore) without the student re-recording anything.
        if (row['Audio File'] && row['Audio File'] !== '(not saved)') {
            line.appendChild(buildAudioRetryButton(row));
        }
        return line;
    }

    const overall = Number(row['Overall']);
    const pct = isNaN(overall) ? null : (overall / 10) * 100;
    const span = document.createElement('span');
    span.className = 'cell-pct ' + pctClass(pct);
    span.textContent = OVERALL_LABELS[overall] || ('Overall: ' + row['Overall']);
    line.appendChild(span);
    const badge = buildTrendBadge(audioOverallOrNull(row), audioOverallOrNull(previousRow), true);
    if (badge) line.appendChild(badge);
    if (row['WPM']) line.appendChild(detailChip(row['WPM'] + ' WPM', true));
    AUDIO_DIMENSIONS.filter(dim => dim !== 'Overall').forEach(dim => { if (row[dim]) line.appendChild(detailChip(dim + ': ' + row[dim], true)); });
    if (row['Reading Summary']) line.appendChild(detailChip(row['Reading Summary'], true));
    if (row['Specific Mistakes'] && row['Specific Mistakes'] !== 'None') line.appendChild(detailChip('Mistakes: ' + row['Specific Mistakes'], true));
    const link = buildAudioLink(row);
    if (link) line.appendChild(link);
    return line;
}

function buildDetailRow(label, lineNode) {
    const row = document.createElement('div');
    row.className = 'detail-row';
    const labelDiv = document.createElement('div');
    labelDiv.className = 'detail-label';
    labelDiv.textContent = label;
    row.appendChild(labelDiv);
    row.appendChild(lineNode);
    return row;
}

// One collapsible row: student name + arrow, expanding to the five section
// detail rows, indented underneath. `histories` holds every attempt per
// section (see sortedRowsByStudent), not just the latest, so each detail
// line can show a trend badge comparing the latest attempt to the one
// before it.
function buildStudentRow(name, histories) {
    const rowWrap = document.createElement('div');
    rowWrap.className = 'student-row';

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'student-toggle';
    const arrow = document.createElement('span');
    arrow.className = 'student-arrow';
    arrow.textContent = '▸';
    toggle.appendChild(arrow);
    toggle.appendChild(document.createTextNode(' ' + name));
    rowWrap.appendChild(toggle);

    const vocabLP = latestAndPrevious(histories.vocab.get(name) || []);
    const masteryLP = latestAndPrevious(histories.vocabMastery.get(name) || []);
    const knowledgeLP = latestAndPrevious(histories.knowledge.get(name) || []);
    const skillsLP = latestAndPrevious(histories.skills.get(name) || []);
    const naviLP = latestAndPrevious(histories.navi.get(name) || []);
    const audioLP = latestAndPrevious(histories.audio.get(name) || []);

    const detail = document.createElement('div');
    detail.className = 'student-detail hidden';
    detail.appendChild(buildDetailRow('Vocabulary', buildVocabDetailLine(vocabLP.latest, vocabLP.previous)));
    detail.appendChild(buildDetailRow('Vocab Mastery', buildVocabMasteryDetailLine(masteryLP.latest, masteryLP.previous)));
    detail.appendChild(buildDetailRow('Chumash Knowledge', buildFractionDetailLine(knowledgeLP.latest, knowledgeLP.previous, 'Total Score', KNOWLEDGE_SUBSECTIONS, 'Areas to Focus On')));
    detail.appendChild(buildDetailRow('Chumash Skills', buildSkillsDetailLine(skillsLP.latest, skillsLP.previous)));
    detail.appendChild(buildDetailRow('Navi Knowledge', buildFractionDetailLine(naviLP.latest, naviLP.previous, 'Total Score', NAVI_SUBSECTIONS, 'Areas to Focus On')));
    detail.appendChild(buildDetailRow('Reading Fluency', buildAudioDetailLine(audioLP.latest, audioLP.previous)));
    rowWrap.appendChild(detail);

    toggle.addEventListener('click', () => {
        const wasHidden = detail.classList.contains('hidden');
        detail.classList.toggle('hidden');
        arrow.textContent = wasHidden ? '▾' : '▸';
    });

    return rowWrap;
}

// Builds the "each student's scores for each section" accordion shown at
// the bottom of Class Averages once a specific class is selected, plus its
// "Export CSV" button.
function buildStudentScoresTable(scope) {
    const wrap = document.createElement('div');
    const headingRow = document.createElement('div');
    headingRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin:30px 0 12px;';
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.style.margin = '0';
    heading.textContent = 'Individual student scores';
    headingRow.appendChild(heading);

    const histories = {
        vocab: sortedRowsByStudent(dashboardData.vocab || []),
        vocabMastery: sortedRowsByStudent(dashboardData.vocabMastery || []),
        knowledge: sortedRowsByStudent(dashboardData.knowledge || []),
        skills: sortedRowsByStudent(dashboardData.skills || []),
        navi: sortedRowsByStudent(dashboardData.navi || []),
        audio: sortedRowsByStudent(dashboardData.audio || [])
    };

    if (scope.students.length) {
        const exportBtn = document.createElement('button');
        exportBtn.type = 'button';
        exportBtn.className = 'btn-secondary';
        exportBtn.textContent = '📥 Export CSV';
        exportBtn.addEventListener('click', () => exportStudentScoresCSV(scope, histories));
        headingRow.appendChild(exportBtn);
    }
    wrap.appendChild(headingRow);

    if (!scope.students.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = `No students found in ${scope.label}.`;
        wrap.appendChild(empty);
        return wrap;
    }

    scope.students.forEach(name => wrap.appendChild(buildStudentRow(name, histories)));
    return wrap;
}

// --- CSV export ------------------------------------------------------
// Shared by both export buttons (the per-student scores table above, and
// the History tab below) — plain-text, comma-and-quote-safe CSV built
// entirely client-side, no server round-trip needed.

function csvField(value) {
    const str = (value === null || value === undefined) ? '' : String(value);
    return /[",\r\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
}

function toCSV(headers, rows) {
    const lines = [headers.map(csvField).join(',')];
    rows.forEach(row => lines.push(row.map(csvField).join(',')));
    return lines.join('\r\n');
}

function todayStamp() {
    return new Date().toISOString().slice(0, 10);
}

// A UTF-8 BOM is prepended so Excel — which otherwise guesses the encoding
// and mangles Hebrew text — opens this correctly instead of showing garbled
// characters.
function downloadCSV(filename, csvContent) {
    const blob = new Blob(['﻿' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFilenamePart(text) {
    return (text || '').replace(/[^\w\- ]/g, '').trim() || 'All Students';
}

// One row per student — a flat "report card" snapshot of their latest
// score in each section, for pulling into a report card or bringing to a
// parent conversation without having to transcribe it off the screen.
function exportStudentScoresCSV(scope, histories) {
    const headers = ['Student', 'Vocabulary', 'Vocab Mastery', 'Chumash Knowledge', 'Chumash Skills', 'Navi Knowledge', 'Reading Fluency'];

    const rows = scope.students.map(name => {
        const vocabRow = latestAndPrevious(histories.vocab.get(name) || []).latest;
        const masteryRow = latestAndPrevious(histories.vocabMastery.get(name) || []).latest;
        const knowledgeRow = latestAndPrevious(histories.knowledge.get(name) || []).latest;
        const skillsRow = latestAndPrevious(histories.skills.get(name) || []).latest;
        const naviRow = latestAndPrevious(histories.navi.get(name) || []).latest;
        const audioRow = latestAndPrevious(histories.audio.get(name) || []).latest;

        const vocabText = vocabRow
            ? fmtPct((parseFraction(vocabRow['Score']) || {}).pct ?? null) + (vocabRow['Score'] ? ' (' + vocabRow['Score'] + ')' : '')
            : 'No attempt yet';
        const masteryText = masteryRow
            ? (Number(masteryRow['Total Mastered']) || 0) + ' / ' + VOCAB_MASTERY_GOAL + ' words'
            : 'No attempt yet';
        const knowledgeText = knowledgeRow
            ? fmtPct((parseFraction(knowledgeRow['Total Score']) || {}).pct ?? null) + (knowledgeRow['Total Score'] ? ' (' + knowledgeRow['Total Score'] + ')' : '')
            : 'No attempt yet';
        const skillsText = skillsRow
            ? fmtPct(parsePercent(skillsRow['Percentage'])) + (skillsRow['Total Score'] ? ' (' + skillsRow['Total Score'] + ')' : '')
            : 'No attempt yet';
        const naviText = naviRow
            ? fmtPct((parseFraction(naviRow['Total Score']) || {}).pct ?? null) + (naviRow['Total Score'] ? ' (' + naviRow['Total Score'] + ')' : '')
            : 'No attempt yet';

        let audioText = 'No submission yet';
        if (audioRow) {
            const needsReview = (audioRow['Reading Summary'] || '').toString().indexOf('AI grading failed') === 0;
            audioText = needsReview
                ? 'Needs manual review'
                : (OVERALL_LABELS[Number(audioRow['Overall'])] || ('Overall: ' + audioRow['Overall'])) + (audioRow['WPM'] ? ' (' + audioRow['WPM'] + ' WPM)' : '');
        }

        return [name, vocabText, masteryText, knowledgeText, skillsText, naviText, audioText];
    });

    downloadCSV(`chumash-scores-${safeFilenamePart(scope.label)}-${todayStamp()}.csv`, toCSV(headers, rows));
}

// --- History tab -----------------------------------------------------

function renderHistoryControls() {
    const select = el('historyStudentSelect');
    const current = select.value;
    select.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'All students';

// Builds the "metrics as rows, dates as columns" comparison grid for one
// specific student — lets a teacher scan across a row to see one metric's
// trend over time, or down a column to see everything that happened on a
// given day. Attempts are bucketed by calendar day (not exact timestamp)
// so a Vocab Check-In and a Knowledge Check-In done the same day land in
// the same column. Only rendered when a single student (not "All
// students") is selected — a matrix doesn't make sense across many
// students in one screen, so that case keeps the flat table below instead.
const HISTORY_METRIC_DEFS = [
    {
        key: 'vocab', label: 'Vocabulary',
        get: r => ({ pct: (parseFraction(r['Score']) || {}).pct ?? null, display: r['Score'] || '—' })
    },
    {
        key: 'knowledge', label: 'Chumash Knowledge',
        get: r => ({ pct: (parseFraction(r['Total Score']) || {}).pct ?? null, display: r['Total Score'] || '—' })
    },
    {
        key: 'skills', label: 'Chumash Skills',
        get: r => ({ pct: parsePercent(r['Percentage']), display: r['Percentage'] || r['Total Score'] || '—' })
    },
    {
        key: 'navi', label: 'Navi Knowledge',
        get: r => ({ pct: (parseFraction(r['Total Score']) || {}).pct ?? null, display: r['Total Score'] || '—' })
    },
    {
        key: 'audio', label: 'Reading Fluency',
        get: r => {
            const n = Number(r['Overall']);
            const pct = isNaN(n) ? null : (n / 10) * 100;
            const display = (OVERALL_LABELS[n] || ('Overall: ' + r['Overall'])) + (r['WPM'] ? ` (${r['WPM']} WPM)` : '');
            return { pct, display };
        }
    }
];

function dayKey(v) {
    const d = toDate(v);
    return d ? d.toDateString() : null;
}

function buildStudentComparisonMatrix(name) {
    const wrap = document.createElement('div');

    const metricsData = HISTORY_METRIC_DEFS.map(def => {
        const studentRows = (dashboardData[def.key] || []).filter(r => (r['Student Name'] || '').toString().trim() === name);
        const byDay = new Map();
        studentRows.forEach(r => {
            const key = dayKey(r['Timestamp']);
            if (!key) return;
            if (!byDay.has(key)) byDay.set(key, []);
            byDay.get(key).push(r);
        });
        return { label: def.label, get: def.get, byDay, hasData: studentRows.length > 0 };
    }).filter(m => m.hasData);

    if (!metricsData.length) return wrap; // nothing to compare yet — flat table below will show the empty state

    const allDays = [...new Set(metricsData.flatMap(m => [...m.byDay.keys()]))]
        .sort((a, b) => new Date(a) - new Date(b));

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = `${name} — comparison over time`;
    wrap.appendChild(heading);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'comparison-wrap';
    const table = document.createElement('table');
    table.className = 'comparison-table';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    const cornerTh = document.createElement('th');
    cornerTh.textContent = 'Metric';
    headRow.appendChild(cornerTh);
    allDays.forEach(day => {
        const th = document.createElement('th');
        th.textContent = new Date(day).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    metricsData.forEach(m => {
        const tr = document.createElement('tr');
        const labelTd = document.createElement('td');
        labelTd.textContent = m.label;
        tr.appendChild(labelTd);

        allDays.forEach(day => {
            const td = document.createElement('td');
            const attemptsThatDay = m.byDay.get(day);
            if (attemptsThatDay && attemptsThatDay.length) {
                attemptsThatDay.forEach((r, i) => {
                    const { pct, display } = m.get(r);
                    const span = document.createElement('span');
                    span.className = 'cell-pct ' + pctClass(pct);
                    span.textContent = display;
                    td.appendChild(span);
                    if (i < attemptsThatDay.length - 1) td.appendChild(document.createElement('br'));
                });
            } else {
                td.textContent = '—';
                td.className = 'cell-empty';
            }
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    wrap.appendChild(tableWrap);
    return wrap;
}

function renderHistoryMatrix(filterName) {
    const area = el('historyMatrixArea');
    area.innerHTML = '';
    if (!filterName) return; // "All students" — matrix doesn't apply, flat table below covers it
    area.appendChild(buildStudentComparisonMatrix(filterName));
}

function renderHistory() {
    const filterName = el('historyStudentSelect').value;
    renderHistoryMatrix(filterName);
    const allowedNames = new Set(getFilteredStudentNames());
    const attempts = [];

    (dashboardData.vocab || []).forEach(row => attempts.push({
        date: row['Timestamp'], name: row['Student Name'], section: 'Vocabulary',
        result: row['Score'] || '—',
        notes: (row['Assigned Group'] ? 'Group ' + row['Assigned Group'] + '. ' : '') +
            (row['Mistakes'] && row['Mistakes'] !== 'None' ? 'Missed: ' + row['Mistakes'] : '')
    }));
    (dashboardData.knowledge || []).forEach(row => attempts.push({
        date: row['Timestamp'], name: row['Student Name'], section: 'Chumash Knowledge',
        result: row['Total Score'] || '—', notes: row['Areas to Focus On'] || ''
    }));
    (dashboardData.skills || []).forEach(row => attempts.push({
        date: row['Timestamp'], name: row['Student Name'], section: 'Chumash Skills',
        result: (row['Total Score'] || '—') + (row['Percentage'] ? ' (' + row['Percentage'] + ')' : ''),
        notes: row['Areas to Focus On'] || ''
    }));
    (dashboardData.navi || []).forEach(row => attempts.push({
        date: row['Timestamp'], name: row['Student Name'], section: 'Navi Knowledge',
        result: row['Total Score'] || '—', notes: row['Areas to Focus On'] || ''
    }));
    (dashboardData.audio || []).forEach(row => attempts.push({
        date: row['Timestamp'], name: row['Student Name'], section: 'Reading Fluency',
        result: (OVERALL_LABELS[Number(row['Overall'])] || ('Overall: ' + row['Overall'])) + (row['WPM'] ? ', ' + row['WPM'] + ' WPM' : ''),
        notes: row['Reading Summary'] || ''
    }));

    let filtered = attempts.filter(a => allowedNames.has((a.name || '').trim()));
    if (filterName) filtered = filtered.filter(a => (a.name || '').trim() === filterName);
    filtered.sort((a, b) => {
        const da = toDate(a.date), db = toDate(b.date);
        if (!da || !db) return 0;
        return db - da;
    });
    currentHistoryRows = filtered; // read by exportHistoryCSV below — always matches what's on screen

    const tbody = el('historyTbody');
    tbody.innerHTML = '';

    if (!filtered.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 4;
        td.className = 'empty-state';
        td.textContent = 'No attempts recorded yet.';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
    }

    filtered.forEach(a => {
        const tr = document.createElement('tr');
        const dateTd = document.createElement('td');
        dateTd.textContent = fmtDate(a.date);
        tr.appendChild(dateTd);

        const sectionTd = document.createElement('td');
        if (!filterName) {
            const strong = document.createElement('div');
            strong.textContent = a.name;
            strong.style.fontWeight = '600';
            sectionTd.appendChild(strong);
        }
        const sectionLine = document.createElement('div');
        sectionLine.textContent = a.section;
        sectionLine.className = filterName ? '' : 'muted';
        sectionTd.appendChild(sectionLine);
        tr.appendChild(sectionTd);

        const resultTd = document.createElement('td');
        resultTd.textContent = a.result;
        tr.appendChild(resultTd);

        const notesTd = document.createElement('td');
        notesTd.className = 'attempt-detail';
        notesTd.textContent = a.notes || '—';
        tr.appendChild(notesTd);

        tbody.appendChild(tr);
    });
}

// Exports exactly what's currently in the History table (same student and
// class/grade filters already applied via currentHistoryRows) as a CSV.
function exportHistoryCSV() {
    const headers = ['Date', 'Student', 'Section', 'Result', 'Notes'];
    const rows = currentHistoryRows.map(a => [fmtDate(a.date), a.name || '', a.section, a.result, a.notes || '']);
    const filterName = el('historyStudentSelect').value;
    const scopeLabel = filterName || getFilterScope().label;
    downloadCSV(`chumash-history-${safeFilenamePart(scopeLabel)}-${todayStamp()}.csv`, toCSV(headers, rows));
}
el('historyExportBtn').addEventListener('click', exportHistoryCSV);

// --- Class averages tab -----------------------------------------------
// This is the landing tab. With "All Students" selected it shows averages
// and an AI-generated trends summary across the whole middle school; a
// grade filter scopes that down to one grade; a class filter scopes it
// down to one class AND adds a per-student score table underneath.

function renderAverages() {
    const panel = el('averagesPanel');
    panel.innerHTML = '';

    const scope = getFilterScope();
    const allowedNames = scope.students;
    const vocabRows = filterRowsByStudents(dashboardData.vocab, allowedNames);
    const vocabMasteryRows = [...latestByStudent(filterRowsByStudents(dashboardData.vocabMastery, allowedNames)).values()];
    const knowledgeRows = filterRowsByStudents(dashboardData.knowledge, allowedNames);
    const skillsRows = filterRowsByStudents(dashboardData.skills, allowedNames);
    const naviRows = filterRowsByStudents(dashboardData.navi, allowedNames);
    const audioRows = filterRowsByStudents(dashboardData.audio, allowedNames);

    panel.appendChild(buildScopeHeading(scope));
    panel.appendChild(buildTrendsSummaryBlock(scope, vocabRows, knowledgeRows, skillsRows, naviRows, audioRows));
    panel.appendChild(buildOverallStats(vocabRows, knowledgeRows, skillsRows, naviRows, audioRows));
    panel.appendChild(buildSectionAverages(
        'Chumash Knowledge — average score by Sefer', knowledgeRows, KNOWLEDGE_SUBSECTIONS,
        r => { const f = parseFraction(r['Total Score']); return f ? f.pct : null; }
    ));
    panel.appendChild(buildSectionAverages(
        'Chumash Skills — average score by category', skillsRows, SKILLS_SUBSECTIONS,
        r => parsePercent(r['Percentage'])
    ));
    panel.appendChild(buildSectionAverages(
        'Navi Knowledge — average score by Sefer', naviRows, NAVI_SUBSECTIONS,
        r => { const f = parseFraction(r['Total Score']); return f ? f.pct : null; }
    ));
    panel.appendChild(buildAudioAverages(audioRows));
    panel.appendChild(buildVocabAverages(vocabRows));
    panel.appendChild(buildVocabMasteryAverages(vocabMasteryRows));

    if (scope.type === 'class') {
        panel.appendChild(buildStudentScoresTable(scope));
    }
}

function buildScopeHeading(scope) {
    const wrap = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'scope-heading';
    h.textContent = scope.label;
    wrap.appendChild(h);

    const sub = document.createElement('div');
    sub.className = 'scope-subtitle';
    const count = scope.students.length;
    let text = count + ' student' + (count === 1 ? '' : 's');
    if (!(dashboardData.roster || []).length) {
        text += ' with at least one submission. No roster sheet found yet, so students who haven\'t submitted anything don\'t show up, and there\'s no grade/class breakdown — add a "Roster" tab (Student Name / Grade / Class / Teacher columns) to your Sheet to enable this.';
    }
    sub.textContent = text;
    wrap.appendChild(sub);
    return wrap;
}

// --- AI trends summary ---------------------------------------------------

// Computes plain-number averages (no DOM) for one slice of rows, reused for
// both the current scope and each subgroup breakdown row. `skipBreakdown`
// omits per-subsection detail for subgroup rows, to keep the prompt sent to
// Gemini compact.
function computeSectionAverageList(vocabRows, knowledgeRows, skillsRows, naviRows, audioRows, skipBreakdown) {
    const avgField = (rows, field) => {
        const pcts = rows.map(r => { const f = parseFraction(r[field]); return f ? f.pct : null; }).filter(p => p !== null);
        return average(pcts);
    };
    const subAvgs = (rows, subsections) => subsections.map(sub => {
        const pcts = rows.map(r => { const f = parseFraction(r[sub]); return f ? f.pct : null; }).filter(p => p !== null);
        return { label: sub, averagePct: average(pcts) };
    });

    const vocabPcts = vocabRows.map(r => { const f = parseFraction(r['Score']); return f ? f.pct : null; }).filter(p => p !== null);
    const skillsPcts = skillsRows.map(r => parsePercent(r['Percentage'])).filter(p => p !== null);
    const audioOverallVals = audioRows.map(r => Number(r['Overall'])).filter(n => !isNaN(n));
    const wpmVals = audioRows.map(r => Number(r['WPM'])).filter(n => !isNaN(n));

    const list = [
        { section: 'Vocabulary', averagePct: average(vocabPcts) },
        { section: 'Chumash Knowledge', averagePct: avgField(knowledgeRows, 'Total Score') },
        { section: 'Chumash Skills', averagePct: average(skillsPcts) },
        { section: 'Navi Knowledge', averagePct: avgField(naviRows, 'Total Score') },
        { section: 'Reading Fluency', averageOutOf4: average(audioOverallVals), averageWpm: average(wpmVals) }
    ];
    if (!skipBreakdown) {
        list[1].breakdown = subAvgs(knowledgeRows, KNOWLEDGE_SUBSECTIONS);
        list[2].breakdown = subAvgs(skillsRows, SKILLS_SUBSECTIONS);
        list[3].breakdown = subAvgs(naviRows, NAVI_SUBSECTIONS);
    }
    return list;
}

function buildSubgroupStats(label, students) {
    const vocabRows = filterRowsByStudents(dashboardData.vocab, students);
    const knowledgeRows = filterRowsByStudents(dashboardData.knowledge, students);
    const skillsRows = filterRowsByStudents(dashboardData.skills, students);
    const naviRows = filterRowsByStudents(dashboardData.navi, students);
    const audioRows = filterRowsByStudents(dashboardData.audio, students);
    return {
        label,
        studentCount: students.length,
        sectionAverages: computeSectionAverageList(vocabRows, knowledgeRows, skillsRows, naviRows, audioRows, true)
    };
}

// Builds the aggregate-only payload sent to the backend for the AI trends
// summary. Includes a grade breakdown when viewing All Students (so Gemini
// can flag e.g. "6th grade is pulling the Skills average down"), or a class
// breakdown when viewing a single grade. No breakdown at the class level —
// there's nothing smaller to compare against.
function computeTrendsStats(scope, vocabRows, knowledgeRows, skillsRows, naviRows, audioRows) {
    const submissionCounts = {
        Vocabulary: vocabRows.length,
        'Chumash Knowledge': knowledgeRows.length,
        'Chumash Skills': skillsRows.length,
        'Navi Knowledge': naviRows.length,
        'Reading Fluency': audioRows.length
    };
    const totalSubmissions = Object.keys(submissionCounts).reduce((sum, k) => sum + submissionCounts[k], 0);

    const stats = {
        scopeLabel: scope.label,
        studentCount: scope.students.length,
        submissionCounts,
        totalSubmissions,
        sectionAverages: computeSectionAverageList(vocabRows, knowledgeRows, skillsRows, naviRows, audioRows)
    };

    const byGrade = dashboardData.rosterByGrade || [];
    if (scope.type === 'all' && byGrade.length > 1) {
        stats.subgroupKind = 'grade';
        stats.subgroups = byGrade.map(g => {
            const students = [...new Set(g.classes.flatMap(c => c.students))];
            return buildSubgroupStats(gradeDisplayLabel(g.grade), students);
        });
    } else if (scope.type === 'grade' && scope.gradeGroup && scope.gradeGroup.classes.length > 1) {
        stats.subgroupKind = 'class';
        stats.subgroups = scope.gradeGroup.classes.map(c =>
            buildSubgroupStats(`${c.className} — ${c.teacherName}`, c.students)
        );
    }

    return stats;
}

// Renders the AI-generated narrative block at the top of Class Averages.
// Caches by filter value + data version so switching tabs/filters back and
// forth doesn't keep re-calling Gemini, and guards against a slow response
// landing after the teacher has already moved on to a different filter.
function buildTrendsSummaryBlock(scope, vocabRows, knowledgeRows, skillsRows, naviRows, audioRows) {
    const wrap = document.createElement('div');
    wrap.className = 'trends-block';
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = 'Overview & Trends';
    wrap.appendChild(heading);

    const body = document.createElement('p');
    body.className = 'trends-text muted';
    wrap.appendChild(body);

    const stats = computeTrendsStats(scope, vocabRows, knowledgeRows, skillsRows, naviRows, audioRows);
    if (stats.totalSubmissions === 0) {
        body.textContent = `No submissions yet for ${scope.label} — check back once students have completed at least one check-in.`;
        return wrap;
    }

    const cacheKey = (el('classFilterSelect').value || '') + '::' + dashboardDataVersion;
    if (trendsSummaryCache[cacheKey]) {
        body.className = 'trends-text';
        body.textContent = trendsSummaryCache[cacheKey];
        return wrap;
    }

    body.textContent = 'Generating summary…';

    const myToken = ++trendsRenderToken;
    const password = el('passwordInput').value;
    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getTrendsSummary', payload: { password, stats } }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => {
        if (myToken !== trendsRenderToken) return; // superseded by a newer render
        if (data.success && data.summary) {
            trendsSummaryCache[cacheKey] = data.summary;
            body.className = 'trends-text';
            body.textContent = data.summary;
        } else {
            body.textContent = data.error || 'Could not generate a summary right now.';
        }
    })
    .catch(() => {
        if (myToken !== trendsRenderToken) return;
        body.textContent = 'Could not reach the server to generate a summary.';
    });

    return wrap;
}

function buildOverallStats(vocabRows, knowledgeRows, skillsRows, naviRows, audioRows) {
    const wrap = document.createElement('div');
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = 'Submission counts';
    wrap.appendChild(heading);

    [['Vocabulary', vocabRows], ['Chumash Knowledge', knowledgeRows],
     ['Chumash Skills', skillsRows], ['Navi Knowledge', naviRows],
     ['Reading Fluency', audioRows]].forEach(([label, rows]) => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        const l = document.createElement('span'); l.textContent = label;
        const v = document.createElement('span'); v.style.fontWeight = '600';
        v.textContent = (rows || []).length + ' submission' + ((rows || []).length === 1 ? '' : 's');
        row.appendChild(l); row.appendChild(v);
        wrap.appendChild(row);
    });
    return wrap;
}

function buildBarRow(label, pct, displayOverride) {
    const row = document.createElement('div');
    row.className = 'bar-row';
    const labelDiv = document.createElement('div');
    labelDiv.className = 'bar-label';
    labelDiv.textContent = label;
    row.appendChild(labelDiv);
    const track = document.createElement('div');
    track.className = 'bar-track';
    const fill = document.createElement('div');
    fill.className = 'bar-fill ' + barClass(pct);
    fill.style.width = (pct === null || isNaN(pct) ? 0 : Math.max(0, Math.min(100, pct))) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    const valueDiv = document.createElement('div');
    valueDiv.className = 'bar-value';
    valueDiv.textContent = displayOverride !== undefined && displayOverride !== null ? displayOverride : fmtPct(pct);
    row.appendChild(valueDiv);
    return row;
}

// Shared shell for a section's averages: a heading with a click-to-expand
// arrow, an always-visible "Overall average" bar, and a nested, initially
// collapsed breakdown built by `buildBreakdown(nestedContainer)`. This is
// what gives Chumash Knowledge/Skills/Navi/Reading Fluency their "overall
// number now, sub-scores on demand" look.
function buildCollapsibleAverages(title, overallPct, overallDisplay, rows, buildBreakdown) {
    const wrap = document.createElement('div');

    const heading = document.createElement('div');
    heading.className = 'section-heading';
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'nested-toggle';
    const arrow = document.createElement('span');
    arrow.className = 'nested-arrow';
    arrow.textContent = '▸';
    toggle.appendChild(arrow);
    toggle.appendChild(document.createTextNode(' ' + title));
    heading.appendChild(toggle);
    wrap.appendChild(heading);

    wrap.appendChild(buildBarRow('Overall average', overallPct, overallDisplay));

    const nested = document.createElement('div');
    nested.className = 'nested-breakdown hidden';
    wrap.appendChild(nested);

    if (!rows || !rows.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No submissions yet.';
        nested.appendChild(empty);
    } else {
        buildBreakdown(nested);
    }

    toggle.addEventListener('click', () => {
        const wasHidden = nested.classList.contains('hidden');
        nested.classList.toggle('hidden');
        arrow.textContent = wasHidden ? '▾' : '▸';
    });

    return wrap;
}

// Builds one section's collapsible averages block (Chumash Knowledge,
// Chumash Skills, Navi Knowledge — all fraction/percentage-based). The
// per-subsection breakdown is sorted weakest-first so the topics most
// worth reviewing float to the top once expanded. `overallPctExtractor`
// reads whichever field holds that section's overall score for one row
// (Knowledge/Navi use the "Total Score" fraction; Skills uses the
// "Percentage" column instead).
function buildSectionAverages(title, rows, subsections, overallPctExtractor) {
    rows = rows || [];
    const overallPcts = rows.map(overallPctExtractor).filter(p => p !== null && p !== undefined && !isNaN(p));
    const overallPct = average(overallPcts);

    return buildCollapsibleAverages(title, overallPct, null, rows, (nested) => {
        const averages = subsections.map(sub => {
            const pcts = rows.map(r => {
                const f = parseFraction(r[sub]);
                return f ? f.pct : null;
            }).filter(p => p !== null);
            return { label: sub, pct: average(pcts) };
        }).sort((a, b) => (a.pct ?? 999) - (b.pct ?? 999));

        averages.forEach(a => nested.appendChild(buildBarRow(a.label, a.pct)));
    });
}

function buildAudioAverages(rows) {
    rows = rows || [];
    const overallVals = rows.map(r => Number(r['Overall'])).filter(n => !isNaN(n));
    const overallAvg = average(overallVals);
    const overallPct = overallAvg === null ? null : (overallAvg / 10) * 100;
    const overallDisplay = overallAvg === null ? '—' : overallAvg.toFixed(1) + ' / 10';

    return buildCollapsibleAverages(
        'Reading Fluency — average rubric scores (out of 10)', overallPct, overallDisplay, rows,
        (nested) => {
            AUDIO_DIMENSIONS.filter(dim => dim !== 'Overall').forEach(dim => {
                const vals = rows.map(r => Number(r[dim])).filter(n => !isNaN(n));
                const avg = average(vals);
                const pct = avg === null ? null : (avg / 10) * 100;
                nested.appendChild(buildBarRow(dim, pct, avg === null ? '—' : avg.toFixed(1) + ' / 10'));
            });

            const wpmVals = rows.map(r => Number(r['WPM'])).filter(n => !isNaN(n));
            const avgWpm = average(wpmVals);
            const wpmRow = document.createElement('div');
            wpmRow.className = 'stat-row';
            const l = document.createElement('span'); l.textContent = 'Average words per minute';
            const v = document.createElement('span'); v.style.fontWeight = '600';
            v.textContent = avgWpm === null ? '—' : Math.round(avgWpm) + ' WPM';
            wpmRow.appendChild(l); wpmRow.appendChild(v);
            nested.appendChild(wpmRow);
        }
    );
}

function buildVocabAverages(rows) {
    const wrap = document.createElement('div');
    const heading = document.createElement('div');
    heading.className = 'section-heading';
    heading.textContent = 'Vocabulary — overview';
    wrap.appendChild(heading);

    rows = rows || [];
    if (!rows.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No submissions yet.';
        wrap.appendChild(empty);
        return wrap;
    }

    const pcts = rows.map(r => { const f = parseFraction(r['Score']); return f ? f.pct : null; }).filter(p => p !== null);
    wrap.appendChild(buildBarRow('Average score (all attempts)', average(pcts)));

    const groupCounts = {};
    rows.forEach(r => {
        const g = (r['Assigned Group'] || 'Unknown').toString();
        groupCounts[g] = (groupCounts[g] || 0) + 1;
    });
    Object.keys(groupCounts).sort().forEach(g => {
        const row = document.createElement('div');
        row.className = 'stat-row';
        const l = document.createElement('span'); l.textContent = 'Group ' + g;
        const v = document.createElement('span'); v.style.fontWeight = '600';
        v.textContent = groupCounts[g] + ' attempt' + (groupCounts[g] === 1 ? '' : 's');
        row.appendChild(l); row.appendChild(v);
        wrap.appendChild(row);
    });
    return wrap;
}

// Vocab Mastery (the adaptive Check-In's persistent word-mastery tracker —
// separate from "Vocabulary — overview" above, which reflects individual
// session scores). `rows` is already one row per student (the latest state
// row from the "Vocab Mastery" sheet), not an append-only log, so no
// latestByStudent call is needed here. Per-student breakdown is sorted
// fewest-mastered-first so students furthest behind the 300-word goal float
// to the top once expanded.
function buildVocabMasteryAverages(rows) {
    rows = rows || [];
    const counts = rows.map(r => Number(r['Total Mastered'])).filter(n => !isNaN(n));
    const overallAvg = average(counts);
    const overallPct = overallAvg === null ? null : (overallAvg / VOCAB_MASTERY_GOAL) * 100;
    const overallDisplay = overallAvg === null ? '—' : Math.round(overallAvg) + ' / ' + VOCAB_MASTERY_GOAL;

    return buildCollapsibleAverages(
        `Vocabulary Mastery — progress toward ${VOCAB_MASTERY_GOAL} words`, overallPct, overallDisplay, rows,
        (nested) => {
            const perStudent = rows.map(r => ({
                name: (r['Student Name'] || '').toString().trim(),
                count: Number(r['Total Mastered']) || 0
            })).sort((a, b) => a.count - b.count);
            perStudent.forEach(s => {
                nested.appendChild(buildBarRow(s.name, (s.count / VOCAB_MASTERY_GOAL) * 100, `${s.count} / ${VOCAB_MASTERY_GOAL}`));
            });
        }
    );
}
